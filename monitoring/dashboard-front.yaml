# Gerado por monitoring/gerar_dashboard.py - não edite à mão
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-front-aula-14
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  front-aula-14.json: |
    {
      "uid": "front-aula-14",
      "title": "Aula 14 - Front da Loja",
      "tags": [
        "aula-14",
        "devops"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "editable": true,
      "panels": [
        {
          "id": 100,
          "type": "row",
          "title": "Golden Signals (RED)",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 1,
          "type": "stat",
          "title": "Requisições/s",
          "description": "Rate (tráfego): sum(rate(http_requests_total[2m]))",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 5,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(http_requests_total{job=\"front-aula-14\"}[2m]))",
              "legendFormat": "req/s"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Taxa de erro (5xx)",
          "description": "Errors: fração das requisições com status 5xx",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 5,
            "y": 1,
            "w": 5,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(http_requests_total{job=\"front-aula-14\", status_code=~\"5..\"}[2m])) / sum(rate(http_requests_total{job=\"front-aula-14\"}[2m]))",
              "legendFormat": "erro"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.01
                  },
                  {
                    "color": "red",
                    "value": 0.05
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Latência p95",
          "description": "Duration: 95% das requisições foram mais rápidas que este valor",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 10,
            "y": 1,
            "w": 5,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job=\"front-aula-14\"}[2m])))",
              "legendFormat": "p95"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.25
                  },
                  {
                    "color": "red",
                    "value": 0.5
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Réplicas no ar",
          "description": "Quantos alvos o Prometheus conseguiu raspar (métrica up)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 15,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(up{job=\"front-aula-14\"})",
              "legendFormat": "up"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "green",
                    "value": 2
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Vendido na última hora",
          "description": "Métrica de negócio: increase() de um counter",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 19,
            "y": 1,
            "w": 5,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(increase(loja_valor_vendido_reais_total{job=\"front-aula-14\"}[1h]))",
              "legendFormat": "R$"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyBRL",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "purple",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Requisições/s por rota",
          "description": "sum by (route) (rate(http_requests_total[2m]))",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (route) (rate(http_requests_total{job=\"front-aula-14\"}[2m]))",
              "legendFormat": "{{route}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Requisições/s por status HTTP",
          "description": "sum by (status_code) (rate(http_requests_total[2m]))",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 5,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (status_code) (rate(http_requests_total{job=\"front-aula-14\"}[2m]))",
              "legendFormat": "{{status_code}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Latência (percentis)",
          "description": "histogram_quantile() sobre os buckets do histograma",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 13,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.5, sum by (le) (rate(http_request_duration_seconds_bucket{job=\"front-aula-14\"}[2m])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job=\"front-aula-14\"}[2m])))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{job=\"front-aula-14\"}[2m])))",
              "legendFormat": "p99"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Latência média por rota",
          "description": "_sum / _count = média",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 13,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (route) (rate(http_request_duration_seconds_sum{job=\"front-aula-14\"}[2m])) / sum by (route) (rate(http_request_duration_seconds_count{job=\"front-aula-14\"}[2m]))",
              "legendFormat": "{{route}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 101,
          "type": "row",
          "title": "Saturação (recursos dos pods)",
          "gridPos": {
            "x": 0,
            "y": 21,
            "w": 24,
            "h": 1
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "CPU por pod",
          "description": "cAdvisor (kubelet): container_cpu_usage_seconds_total",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 22,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"aula-14\", pod=~\"front-aula-14-.*\", container=\"front\"}[2m]))",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cores",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Memória por pod",
          "description": "cAdvisor (kubelet): container_memory_working_set_bytes",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 22,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"aula-14\", pod=~\"front-aula-14-.*\", container=\"front\"})",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 102,
          "type": "row",
          "title": "Negócio",
          "gridPos": {
            "x": 0,
            "y": 30,
            "w": 24,
            "h": 1
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 12,
          "type": "bargauge",
          "title": "Estoque por produto (gauge)",
          "description": "Métrica do tipo gauge: valor atual",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 31,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (produto) (loja_estoque_produto)",
              "legendFormat": "{{produto}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "green",
                    "value": 5
                  }
                ]
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Pedidos por minuto por cupom",
          "description": "rate() * 60 = por minuto",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 31,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (cupom) (rate(loja_pedidos_total{job=\"front-aula-14\"}[2m])) * 60",
              "legendFormat": "{{cupom}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        }
      ],
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      }
    }
