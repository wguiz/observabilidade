apiVersion: v1
kind: Service
metadata:
  name: front-aula-14
  namespace: aula-14
  labels:
    app: front-aula-14
spec:
  type: NodePort
  selector:
    app: front-aula-14
  ports:
    # O nome da porta é usado pelo ServiceMonitor
    - name: http
      port: 80
      targetPort: http
      # 30082 para não conflitar com o seu front (30081, aulas 11 e 12)
      nodePort: 30082
